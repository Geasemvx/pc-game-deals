<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Game Deals</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <h1>PC Game Deals</h1>

        <div class="search-container">
            <input type="search"
                   id="searchInput"
                   placeholder="Search games..."
                   aria-label="Search games">

            <label class="filter-label">
                <input type="checkbox" id="saleFilter">
                Show only games on sale
            </label>
        </div>

        <!-- Empty on purpose: the CSS shows a pulsing "Loading deals…" until the cards arrive -->
        <div id="games" aria-live="polite"></div>

        <footer class="footer">
            <p>Developer Assessment Project</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
